<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meridian | Your money today</title>
  <meta name="description" content="Meridian Bank customer dashboard, a React + TypeScript app on the SpectrumOS DLS." />
  <!-- Set the theme before first paint to avoid a flash of the wrong mode.
       The React ThemeProvider reads this attribute on mount. -->
  <script>
    (function () {
      try {
        var c = localStorage.getItem("meridian-theme");
        var dark = c === "dark" || (!c && window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
